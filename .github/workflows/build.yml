name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - 'README.md'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (NSIS 安装版 + 便携版)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 Windows 产物
        run: npm run build -- --publish never

      - name: 列出产物（排查用）
        shell: bash
        run: ls -la dist/ || echo "dist 目录不存在"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  build-macos:
    name: macOS (arm64 zip)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 macOS 产物
        run: npm run build:mac -- --publish never

      - name: 列出产物（排查用）
        run: ls -la dist/ || echo "dist 目录不存在"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: 发布 Release（仅标签触发）
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出仓库（gh release 需要 git 上下文）
        uses: actions/checkout@v4

      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理产物为英文名（GitHub 资产名不支持中文，会被丢弃）
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-files
          VER="${TAG#v}"
          for f in artifacts/windows-artifacts/*安装版.exe; do
            if [ -e "$f" ]; then mv "$f" "release-files/ClassMaster-$VER-Windows-Setup.exe"; fi
          done
          for f in artifacts/windows-artifacts/*便携版.exe; do
            if [ -e "$f" ]; then mv "$f" "release-files/ClassMaster-$VER-Windows-Portable.exe"; fi
          done
          for f in artifacts/macos-artifacts/*.zip; do
            if [ -e "$f" ]; then mv "$f" "release-files/ClassMaster-$VER-macOS-arm64.zip"; fi
          done
          ls -la release-files/

      - name: 创建 Release 并附加产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接补充上传产物"
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --title "班级智管 $TAG" \
              --generate-notes
          fi
