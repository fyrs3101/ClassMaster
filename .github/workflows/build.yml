name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (NSIS 安装版 + 便携版)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 Windows 产物
        run: npm run build

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  build-macos:
    name: macOS (arm64 zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包 macOS 产物
        run: npm run build:mac

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: 发布 Release（仅标签触发）
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 创建 Release 并附加产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/windows-artifacts/* artifacts/macos-artifacts/* \
            --title "班级智管 $TAG" \
            --generate-notes
